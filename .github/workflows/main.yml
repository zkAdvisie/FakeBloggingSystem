name: Build and Test Docker

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f FakeBloggingSystem/Dockerfile -t fake-blogging-api FakeBloggingSystem

      - name: Start Docker container
        run: |
          docker images
          docker create --name fake-blogging-api -p 8080:8080 fake-blogging-api
          docker start fake-blogging-api
          docker ps -a
         

          
      - name: Check endpoint
        run: |
          docker ps -a
          docker logs fake-blogging-api
          sleep 5 
          curl -v http://localhost:8080/post/1 || true
          docker logs fake-blogging-api


          exit 1
    
