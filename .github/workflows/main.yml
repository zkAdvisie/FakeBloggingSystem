name: Build and Test Docker

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f FakeBloggingSystem/Dockerfile -t fake-blogging-api FakeBloggingSystem

      - name: Start Docker container
        run: |
          for i in {1..15}; do
            if curl -s -o /dev/null http://localhost:8080/post/1; then 
             echo "Api is working"
             exit 0
            fi
            sleep 2
          done
          docker logs fake-blogging-api
          exit 1
      - name: Show logs
        if: always()
        run: docker logs fake-blogging-api || true

