name: Build and Test Docker

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f FakeBloggingSystem/Dockerfile -t fake-blogging-api FakeBloggingSystem

      - name: Start Docker container
        run: |
          docker images
          docker create --name fake-blogging-api -p 8080:8080 fake-blogging-api
          docker start fake-blogging-api
          docker ps -a
         

          
      - name: Check endpoint
        run: |
          docker ps -a
          docker logs fake-blogging-api
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /tmp/api-response.txt -w "%{http_code}"
            http://localhost:8080/post/1 || true)
             echo "Attempt $i: Http $Http_Code"
             cat /tmp/api-response.txt 2>/dev/null ||true
              echo ""
              if [ "$Http_Code" = "200" ] || ["$HTTP_CODE" = "404 ]; then
               echo " success"
               exit 0
              fi
              sleep 2
              done

              docker logs fake-blogging-api
             logging-api
          exit 1
    
