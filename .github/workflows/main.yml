name: Build and Test Docker

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f FakeBloggingSystem/Dockerfile -t fake-blogging-api FakeBloggingSystem

       - name: Start Docker container
        run: |
          docker run -d --name fake-blogging-api -p 8080:8080 fake-blogging-api
         
      - name: Check container status
        run: |
          docker ps -a
          docker logs fake-blogging-api
          
      - name: Check endpoint
        run: |
          for i in {1..15}; do
            if curl --fail -silent http://localhost:8080/post/1 > /dev/null; then 
             echo "Api is working"
             exit 0
            fi
            sleep 2
          done

          echo "Api error"
          docker ps -a
          exit 1
    
